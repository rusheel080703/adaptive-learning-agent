<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adaptive Quiz</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="container">
        <div id="aiPanel" class="ai-insight-panel">
            <div class="ai-header">
                <span>🤖 AI Learning Agent</span>
            </div>
            <div id="aiReasoning" style="color: #4b5563; font-size: 0.95rem;">
                </div>
            <div class="ai-tags">
                <span id="strategyTag" class="tag tag-strategy">Standard</span>
                <span id="difficultyTag" class="tag tag-diff">Medium</span>
            </div>
        </div>

        <div class="card">
            <div style="display: flex; justify-content: space-between; margin-bottom: 20px; color: var(--text-muted);">
                <span id="quizTopic">Loading...</span>
                <span>Score: <b id="scoreDisplay">0</b></span>
            </div>

            <div id="quizContainer">
                <div id="questionText" class="question-text">Loading adaptive content...</div>
                <div id="optionsContainer" class="options-grid"></div>
            </div>

            <div id="feedbackArea" style="margin-top: 20px; display: none;">
                <div id="explanationText" style="padding: 15px; background: #f8fafc; border-radius: 8px; border-left: 4px solid var(--text-muted);"></div>
            </div>

            <button id="nextBtn" class="btn-primary" style="display: none;" onclick="nextQuestion()">Next Question</button>
        </div>
        
        <div class="card">
            <h3>🔴 Live Session</h3>
            <ul id="leaderboardList" style="padding-left: 20px; color: var(--text-muted);"></ul>
        </div>
    </div>

    <input type="hidden" id="quiz_id" value="{{ quiz_id }}">
    
    <script src="/static/js/quiz.js"></script>
</body>
</html>
