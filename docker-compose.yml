# docker-compose.yml (Corrected for Day 4)
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adaptive-agent-api
    ports:
      - "8000:8080"
    volumes:
      # Mount your local 'app' folder to the container's '/code/app'
      - ./app:/code/app
    environment:
      # Use the 'asyncpg' driver, matching our Python code
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/quizdb
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL_NAME: mistral:7b
    depends_on:
      - redis
      - db # NEW: Wait for the database
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:7-alpine
    container_name: adaptive-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # NEW: PostgreSQL Database Service
  db:
    image: postgres:16
    container_name: adaptive-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: quizdb
    ports:
      - "5432:5432" # Optional: Expose to host for debugging
    volumes:
      - postgres_data:/var/lib/postgresql/data # Persist data

volumes:
  redis_data:
  postgres_data: # Define the persistent volume